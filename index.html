<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Routines – English Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4ff;--ink:#22284a;--mute:#6b7398;--card:#fff;--line:#dfe6fb;--pri:#5b6cff;--pri2:#8a5bff;--ok:#2fbf71;--okbg:#d9f7e6;--no:#ff5c5c;--nobg:#ffe1e1;--gold:#ffc53d;--sh:0 10px 30px rgba(60,80,180,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#141833;--ink:#f1f3ff;--mute:#a4abd6;--card:#20264b;--line:#323a70;--sh:0 10px 30px rgba(0,0,0,.35);--okbg:#1d4a35;--nobg:#5a2530}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:19px;min-height:100vh;
background-image:radial-gradient(circle at 8% 12%,#8a5bff22 0,transparent 32%),radial-gradient(circle at 92% 8%,#5bd0ff2a 0,transparent 30%),radial-gradient(circle at 80% 95%,#ffc53d22 0,transparent 30%);background-attachment:fixed}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.hin{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05em;cursor:pointer;border:0;background:none;color:var(--ink);font-family:inherit;text-align:left}
.logo i{font-style:normal;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));font-size:1.3em;box-shadow:0 4px 12px #5b6cff66}
.logo small{display:block;font-size:.6em;color:var(--mute);font-weight:500;margin-top:-3px}
#hud{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 13px;font-weight:600;font-size:.85em}
.pb{flex-basis:100%;height:8px;background:var(--line);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff9f43);border-radius:9px;transition:width .6s}
main{max-width:960px;margin:0 auto;padding:18px 16px 60px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}.top h2{margin:0;font-size:1.35em;font-weight:700}
.btn{font:inherit;font-weight:600;min-height:54px;padding:10px 24px;border:0;border-radius:16px;background:var(--pri);color:#fff;cursor:pointer;box-shadow:0 5px 0 #3a48c2;transition:.12s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3a48c2}
.btn.sm{min-height:44px;padding:6px 16px;font-size:.85em;border-radius:13px;box-shadow:0 4px 0 #3a48c2}
.btn.go{background:var(--ok);box-shadow:0 5px 0 #1e8d52}.btn.alt{background:var(--gold);color:#4a3600;box-shadow:0 5px 0 #c99500}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
:focus-visible{outline:4px solid #ff9f43;outline-offset:2px}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:28px;padding:22px 24px;box-shadow:var(--sh);margin-bottom:22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:#ffffff18}
.mascot{font-size:4.2em;animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.hero h1{margin:0 0 4px;font-size:1.5em}.hero p{margin:0;opacity:.92;font-size:.9em}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),#ffffff33 0);display:grid;place-items:center;position:relative;z-index:1}
.ring b{width:66px;height:66px;border-radius:50%;background:var(--pri2);display:grid;place-items:center;font-size:1.05em}
h3.sec{margin:6px 0 12px;font-size:1.05em;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{--c:#5b6cff;font:inherit;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;cursor:pointer;color:var(--ink);box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:6px;position:relative;transition:.15s}
.tile:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 9px 0 color-mix(in srgb,var(--c) 30%,transparent)}
.tile .ic{width:60px;height:60px;border-radius:19px;display:grid;place-items:center;font-size:1.9em;background:color-mix(in srgb,var(--c) 18%,transparent);border:2px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tile b{font-size:1.02em}.tile span{font-size:.72em;color:var(--mute);line-height:1.25}.tile .st{font-size:.95em;letter-spacing:2px;min-height:22px}
.tile .n{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-size:.72em;font-weight:700;display:grid;place-items:center}
.tile.dn{border-color:var(--ok)}.tile.dn .n{background:var(--ok)}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;margin:12px 0;box-shadow:var(--sh);text-align:center}
.card h3{margin:0 0 6px}
.big{font-size:1.7em;font-weight:700;margin:8px 0}.em{font-size:2.8em;line-height:1.15;filter:drop-shadow(0 3px 3px #0002)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.opt,.fc{font:inherit;font-weight:600;min-height:96px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:6px;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px;transition:.12s}
.opt:hover:not(:disabled),.fc:hover{border-color:var(--pri);transform:translateY(-2px)}
.opt.ok,.fc.ok{background:var(--okbg);border-color:var(--ok);animation:pop .4s}.opt.no{background:var(--nobg);border-color:var(--no);opacity:.75}.opt.sel,.fc.sel{border-color:var(--gold);background:#fff4c9;color:#5a4300}
@keyframes pop{50%{transform:scale(1.08)}}
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#39d98a,#2fbf71);border-radius:99px;transition:width .4s}
.good{color:var(--ok);font-weight:700;font-size:1.15em}.bad{color:var(--no);font-weight:700}
.fbox{min-height:60px;margin:10px 0}
.ln{text-align:left;padding:6px 10px;border-radius:12px;margin:4px 0;background:color-mix(in srgb,var(--pri) 8%,transparent)}.ln .em{font-size:1.6em;margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.slot{min-width:84px;min-height:84px;border:3px dashed var(--pri);border-radius:18px;display:grid;place-items:center;font-size:2.3em;background:var(--card);cursor:pointer;color:var(--mute);font-family:inherit}
.slot.bad{border-color:var(--no);background:var(--nobg)}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#000;margin:10px 0}
.step{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;font-size:.8em;margin-right:6px}
input{font:inherit;padding:11px 14px;border-radius:14px;border:2px solid var(--line);width:100%;max-width:400px;background:var(--card);color:var(--ink)}
.star{font-size:2.8em;letter-spacing:6px}
.fx{position:fixed;font-size:2em;pointer-events:none;animation:up 1.3s ease-out forwards;z-index:99}@keyframes up{to{transform:translateY(-240px) rotate(220deg);opacity:0}}
details{margin-top:22px;font-size:.8em;color:var(--mute)}summary{cursor:pointer;font-weight:600}
@media(max-width:560px){body{font-size:17px}.hero{grid-template-columns:auto 1fr}.ring{display:none}.grid{grid-template-columns:1fr 1fr;gap:12px}.tile{padding:12px}.tile span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hin"><button class="logo" onclick="go()" aria-label="Home"><i>🏫</i><div>School Routines<small>English • Grade 1 • Pre-A1</small></div></button><div id="hud"></div></div><div class="hin" style="margin-top:8px"><div class="pb"><i id="pbi"></i></div></div></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const sh=a=>[...a].sort(()=>Math.random()-.5),pick=a=>a[Math.floor(Math.random()*a.length)],cap=s=>s[0].toUpperCase()+s.slice(1);
let P={};try{P=JSON.parse(localStorage.getItem('sr1')||'{}')}catch(e){}
P.pts=P.pts||0;P.stars=P.stars||0;P.best=P.best||{};P.yt=P.yt||{};
const save=()=>{try{localStorage.setItem('sr1',JSON.stringify(P))}catch(e){}};
const GOOD=['Excellent! 🌟','Great job! 👏','You did it! 🎉','Super! 🚀','Well done! 💪'],TRY=['Try again! 💪','Almost! Try again.','Look and listen again! 👀'];
const W=[['wake up','😴','I wake up.'],['go to school','🚌','I go to school.'],['enter the classroom','🚪','I enter the classroom.'],['sit down','🪑','Sit down, please.'],['stand up','🧍','Stand up, please.'],['open your book','📖','Open your book.'],['close your book','📕','Close your book.'],['listen','👂','Listen to the teacher.'],['read','📚','I read a book.'],['write','✏️','I write my name.'],['draw','🎨','I draw a star.'],['color','🖍️','I color the sun.'],['raise your hand','🙋','Raise your hand.'],['ask a question','❓','I ask a question.'],['play','⚽','I play with friends.'],['eat lunch','🍎','I eat lunch.'],['clean up','🧹','Clean up, please.'],['go home','🏠','I go home.']];
const UNITS=['Unit 1 ☀️ Morning','Unit 2 ✏️ In Class','Unit 3 🏠 Helping & Home'];
const F=[['🪑','Sit ___.','down'],['🧍','Stand ___.','up'],['📖','Open your ___.','book'],['🙋','Raise your ___.','hand'],['🏠','Go ___.','home'],['🍎','Eat ___.','lunch'],['🧹','Clean ___.','up'],['🚌','Go to ___.','school'],['❓','Ask a ___.','question'],['😴','Wake ___.','up']];
const S=[{n:'Sam',l:[['⏰','Sam wakes up.'],['🚌','He goes to school.'],['🪑','He sits down.'],['📖','He reads a book.'],['🏠','He goes home.']],q:[['Where does Sam go?','school',['school','park','shop']],['What does Sam read?','a book',['a book','a ball','a pencil']],['Sam ___ at the end.','goes home',['goes home','plays','draws']]]},
{n:'Mia',l:[['🚪','Mia enters the classroom.'],['🙋','She raises her hand.'],['❓','She asks a question.'],['🎨','She draws a picture.'],['🍎','She eats lunch.']],q:[['Who enters the classroom?','Mia',['Mia','Sam','Teacher']],['What does Mia raise?','her hand',['her hand','her book','her bag']],['What does Mia draw?','a picture',['a picture','a house','a cat']]]}];
const T=[{id:'jIYvcAdTO8k',t:'Sit down and stand up',b:'🪑 What is this action?',o:['sit down','stand up','listen'],c:0,w:['sit down','stand up','clap your hands','open your book']},
{id:'pEx5entLOFQ',t:'Morning routine',b:'😴 What is this action?',o:['go home','wake up','play'],c:1,w:['wake up','go to school','eat','go home']},
{id:'WsiRSWthV1k',t:'Classroom actions',b:'✏️ What is this action?',o:['read','draw','write'],c:2,w:['listen','read','write','draw']}];
/* Real recordings from ./audio/<word>.mp3 first; device voice only as backup */
function speak(t){let d=0;const f=()=>{if(!d){d=1;tts(t)}};const a=new Audio('audio/'+t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.mp3');a.onerror=f;a.play().catch(f)}
function tts(t){if(!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
function boom(){for(let i=0;i<12;i++){const s=document.createElement('span');s.className='fx';s.textContent=pick(['⭐','🎉','🌟','✨','🎈']);s.style.left=(8+Math.random()*84)+'vw';s.style.top=(45+Math.random()*35)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),1400)}}
const MODS=[['learn','📚','Learn','Flip cards, see and say the words','#ff6b6b'],['watch','🎬','Watch and Learn','Videos with questions','#ff922b'],['listen','👂','Listen and Choose','Hear it, tap the picture','#339af0'],['match','🔗','Read and Match','Join words with pictures','#20c997'],['read','📖','Reading','Short stories and questions','#9775fa'],['fill','✏️','Fill in the Blanks','Finish the sentence','#f06595'],['tpr','🤸','Listen and Do','Listen and move your body','#12b886'],['order','🔢','Put in Order','Order the school day','#fcc419'],['memory','🧠','Memory Game','Find the pairs','#4c6ef5'],['final','🏆','Final Challenge','Show what you know!','#7950f2']];
function hud(){const n=MODS.filter(m=>P.best[m[0]]>0).length;$('#hud').innerHTML=`<span class="chip">⭐ ${P.stars}</span><span class="chip">🎯 ${P.pts}</span><span class="chip">🏅 ${n}/10</span>`;$('#pbi').style.width=n*10+'%'}
const head=t=>`<div class="top"><button class="btn sm ghost" onclick="go()" aria-label="Home">⬅ Home</button><h2>${t}</h2></div>`;
function finish(m,s){P.best[m]=Math.max(P.best[m]||0,s);save();hud()}
function go(m){try{speechSynthesis.cancel()}catch(e){}scrollTo(0,0);({learn:vLearn,watch:vWatch,listen:()=>quiz('listen','👂 Listen and Choose',sh(W).slice(0,8).map(qL)),match:vMatch,read:()=>{const s=pick(S);quiz('read','📖 Story: '+s.n,s.q.map(q=>qS(s,q)))},fill:()=>quiz('fill','✏️ Fill in the Blanks',sh(F).slice(0,6).map(qF)),tpr:()=>quiz('tpr','🤸 Listen and Do',sh(W).slice(0,8).map(qT)),order:()=>vOrder(0),memory:vMemory,final:vFinal}[m]||home)()}
function home(){const n=MODS.filter(m=>P.best[m[0]]>0).length,pct=n*10,msg=n==0?"Hi! I'm Ollie. Let's learn school words!":n<10?'Great job! Keep going!':'You are a School Star! 🏆';
app.innerHTML=`<section class="hero"><div class="mascot" aria-hidden="true">🦉</div><div><h1>Hello, friend! 👋</h1><p>${msg}</p></div><div class="ring" style="--p:${pct}" role="img" aria-label="${pct}% complete"><b>${pct}%</b></div></section>
<h3 class="sec">Choose an activity</h3><div class="grid">${MODS.map((m,i)=>`<button class="tile ${P.best[m[0]]?'dn':''}" style="--c:${m[4]}" onclick="go('${m[0]}')"><span class="n">${P.best[m[0]]?'✓':i+1}</span><div class="ic">${m[1]}</div><b>${m[2]}</b><span>${m[3]}</span><div class="st">${'⭐'.repeat(P.best[m[0]]||0)}${'<span style="opacity:.25">☆</span>'.repeat(3-(P.best[m[0]]||0))}</div></button>`).join('')}</div>
<details><summary>👩‍🏫 Teacher notes</summary><p>Voices: put your recordings in an <b>audio</b> folder next to this file, named like <b>sit-down.mp3</b>, <b>wake-up.mp3</b>. If a file is missing or the device is offline, the device voice plays as backup.<br>Videos: the three videos in "Watch and Learn" can be replaced by pasting another YouTube link.</p><button class="btn sm ghost" onclick="if(confirm('Reset progress?')){P={pts:0,stars:0,best:{},yt:P.yt};save();hud();home()}">Reset progress</button></details>`;hud()}
const opt=w=>({k:w[0],e:w[1],l:w[0]}),oth=(w,n)=>sh(W.filter(x=>x!==w)).slice(0,n);
const qL=w=>({p:'Listen and choose 👂',say:w[0],auto:1,c:w[0],o:sh([w,...oth(w,2)]).map(opt),show:'e',h:'Tap 🔊 to hear it again.'});
const qR=w=>({p:cap(w[0]),say:w[0],c:w[0],o:sh([w,...oth(w,2)]).map(opt),show:'e',h:'Tap 🔊 and match the sound.'});
const qT=w=>({p:'Teacher says: "'+cap(w[0])+'!"',say:w[0],auto:1,c:w[0],o:sh([w,...oth(w,3)]).map(opt),show:'el',done:'Now do it: '+w[1]+' '+w[0]+'!',h:'Listen again and look at the pictures.'});
const qF=f=>{const b=sh([f[2],...sh([...new Set(F.map(x=>x[2]))].filter(x=>x!==f[2])).slice(0,3)]);return{pre:`<div class="em">${f[0]}</div>`,p:f[1].replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>'),c:f[2],o:b.map(x=>({k:x,l:x})),show:'l',h:'Look at the picture '+f[0]}};
const qS=(s,q)=>({pre:s.l.map(l=>`<div class="ln"><span class="em">${l[0]}</span> ${l[1]}</div>`).join(''),say:s.l.map(l=>l[1]).join(' '),p:q[0],c:q[1],o:sh(q[2]).map(x=>({k:x,l:x})),show:'l',h:'Read the story again. 🔍'});
function quiz(mod,title,qs){let i=0,sc=0;
const show=()=>{if(i>=qs.length)return end();const q=qs[i];let tr=0;
app.innerHTML=head(title)+`<div class="bar" role="progressbar" aria-valuenow="${i}" aria-valuemax="${qs.length}"><i style="width:${i/qs.length*100}%"></i></div><small style="color:var(--mute)">Question ${i+1} of ${qs.length}</small><div class="card">${q.pre||''}<div class="big">${q.p}</div>${q.say?'<button class="btn" id="snd">🔊 Listen</button>':''}</div><div class="opts">${q.o.map((o,n)=>`<button class="opt" data-n="${n}">${q.show.includes('e')?`<span class="em">${o.e}</span>`:''}${q.show.includes('l')?`<span>${o.l}</span>`:''}</button>`).join('')}</div><div class="fbox" id="fb" aria-live="polite"></div><button class="btn alt sm" id="hint">💡 Hint</button>`;
const fb=$('#fb');if(q.say){$('#snd').onclick=()=>speak(q.say);if(q.auto)setTimeout(()=>speak(q.say),300)}
$('#hint').onclick=()=>fb.innerHTML=`<p>💡 ${q.h}</p>`;
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=q.o[b.dataset.n];
if(o.k===q.c){app.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('ok');const f=!tr;P.pts+=f?10:5;if(f){sc++;P.stars++}save();hud();boom();
fb.innerHTML=`<p class="good">${pick(GOOD)} ${q.done||''}</p><button class="btn go" id="nx">Next ➡️</button>`;$('#nx').onclick=()=>{i++;show()};$('#nx').focus()}
else{tr++;b.disabled=true;b.classList.add('no');fb.innerHTML=`<p class="bad">${pick(TRY)}</p>${tr>=2?'<p>💡 '+q.h+'</p>':''}`}})};
const end=()=>{const r=sc/qs.length,s=r>=.9?3:r>=.6?2:1;finish(mod,s);boom();app.innerHTML=head('Finished!')+`<div class="card"><div class="mascot" style="font-size:4em">🦉</div><div class="star">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><div class="big">You did it!</div><p>${sc} of ${qs.length} correct on the first try</p><div class="row"><button class="btn go" onclick="go('${mod}')">🔄 Play again</button><button class="btn ghost" onclick="go()">🏠 Home</button></div></div>`};
show()}
let heard=new Set(),unit=0;
function vLearn(){app.innerHTML=head('📚 Learn')+`<div class="row">${UNITS.map((u,i)=>`<button class="btn sm ${i==unit?'':'ghost'}" data-u="${i}">${u}</button>`).join('')}</div><div class="grid" style="margin-top:14px">${W.slice(unit*6,unit*6+6).map(w=>`<div class="card" style="margin:0"><div class="em">${w[1]}</div><div class="big">${w[0]}</div><p style="color:var(--mute);margin:4px 0 10px">${w[2]}</p><div class="row"><button class="btn sm" data-w="${w[0]}">🔊 Word</button><button class="btn sm alt" data-s="${w[2]}">🔊 Sentence</button></div></div>`).join('')}</div>`;
app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{unit=+b.dataset.u;vLearn()});
app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{speak(b.dataset.w);heard.add(b.dataset.w);if(heard.size>=12){finish('learn',3)}else if(!P.best.learn)finish('learn',1)});
app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(b.dataset.s))}
function vWatch(){const on=navigator.onLine;
app.innerHTML=head('🎬 Watch and Learn')+(on?'':'<div class="card"><p class="bad">📴 No internet. Videos need internet. Try Learn or the games!</p></div>')+T.map((t,i)=>{const id=P.yt[i]||t.id;return`<div class="card"><h3>${t.t}</h3><p><span class="step">1</span><b>Before</b> · ${t.b}</p><div class="row">${t.o.map((o,n)=>`<button class="btn sm ghost" data-b="${i}.${n}">${o}</button>`).join('')}</div><p id="fb${i}"></p>
<p><span class="step">2</span><b>Watch</b> 👀</p>${on?`<iframe src="https://www.youtube-nocookie.com/embed/${id}" title="${t.t}" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`:''}
<div class="row"><a class="btn sm ghost" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">▶ Open on YouTube</a></div>
<details style="margin:10px 0"><summary>Change video</summary><div class="row" style="margin-top:8px"><input id="u${i}" placeholder="Paste YouTube link" aria-label="YouTube link"><button class="btn sm go" data-v="${i}">Save</button></div></details>
<p><span class="step">3</span><b>After</b> · Tap the words you heard:</p><div class="row">${t.w.map(w=>`<button class="btn sm alt" data-a="${i}" aria-pressed="false">${w}</button>`).join('')}</div><button class="btn sm go" data-c="${i}" style="margin-top:10px">✔ Check</button><p id="fa${i}"></p></div>`}).join('');
app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const[i,n]=b.dataset.b.split('.');$('#fb'+i).innerHTML=+n===T[i].c?'<span class="good">Excellent! Now watch! 👀</span>':'<span class="bad">Try again!</span>';if(+n===T[i].c){P.pts+=5;save();hud()}});
app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const m=$('#u'+b.dataset.v).value.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);if(!m)return alert('Link not valid. Copy the full YouTube link.');P.yt[b.dataset.v]=m[1];save();vWatch()});
app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const p=b.getAttribute('aria-pressed')!='true';b.setAttribute('aria-pressed',p);b.style.outline=p?'4px solid var(--ok)':''});
app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const i=b.dataset.c,n=app.querySelectorAll(`[data-a="${i}"][aria-pressed="true"]`).length;$('#fa'+i).innerHTML=n?'<span class="good">Great listening! 🌟</span>':'<span class="bad">Watch again and choose words.</span>';if(n){boom();P.pts+=10;P.stars++;finish('watch',3)}})}
function vMatch(){const ws=sh(W).slice(0,5),L=ws.map((w,i)=>({w,t:i<3?w[0]:w[2]})),R=sh(ws);let a=null,b=null,done=new Set(),err=0;
const draw=()=>{app.innerHTML=head('🔗 Read and Match')+`<p style="color:var(--mute)">Tap a word 👆 then tap its picture.</p><div class="opts" style="grid-template-columns:1fr 1fr"><div>${L.map((x,i)=>`<button class="opt ${done.has(x.w)?'ok':''} ${a===x.w?'sel':''}" style="width:100%;margin-bottom:12px;min-height:76px" data-l="${i}" ${done.has(x.w)?'disabled':''}>${x.t}</button>`).join('')}</div><div>${R.map((w,i)=>`<button class="opt ${done.has(w)?'ok':''} ${b===w?'sel':''}" style="width:100%;margin-bottom:12px;min-height:76px" data-r="${i}" ${done.has(w)?'disabled':''}><span class="em" style="font-size:2.2em">${w[1]}</span></button>`).join('')}</div></div><div class="fbox" id="fb" aria-live="polite"></div>`;
app.querySelectorAll('[data-l]').forEach(e=>e.onclick=()=>{a=L[e.dataset.l].w;speak(a[0]);chk()});app.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{b=R[e.dataset.r];chk()})};
const chk=()=>{if(a&&b){if(a===b){done.add(a);P.pts+=10;P.stars++;save();hud();a=b=null;draw();$('#fb').innerHTML='<span class="good">'+pick(GOOD)+'</span>';if(done.size==5){const s=err<=1?3:err<=3?2:1;finish('match',s);boom();$('#fb').innerHTML=`<div class="card"><div class="star">${'⭐'.repeat(s)}</div><div class="big">You did it!</div><button class="btn go" onclick="go('match')">🔄 Play again</button></div>`}}else{err++;a=b=null;draw();$('#fb').innerHTML='<span class="bad">Try again! 💪</span>'}}else draw()};
draw()}
function vOrder(){const st=Math.floor(Math.random()*(W.length-4)),seq=W.slice(st,st+5);let pool=sh(seq),slots=[null,null,null,null,null],tries=0,bad=[];
const draw=()=>{app.innerHTML=head('🔢 Put in Order')+`<p style="color:var(--mute)">What comes first? Tap the pictures in order.</p><div class="row">${slots.map((s,i)=>`<button class="slot ${bad.includes(i)?'bad':''}" data-s="${i}" aria-label="Step ${i+1}">${s?s[1]:i+1}</button>`).join('')}</div><div class="row" style="margin:16px 0">${pool.map((w,i)=>`<button class="opt" style="min-width:120px" data-p="${i}"><span class="em">${w[1]}</span><span>${w[0]}</span></button>`).join('')}</div><div class="row"><button class="btn go" id="ck">✔ Check</button><button class="btn ghost" id="rs">🔄 Reset</button></div><div class="fbox" id="fb" aria-live="polite"></div>`;
app.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{const k=slots.indexOf(null);if(k<0)return;speak(pool[e.dataset.p][0]);slots[k]=pool.splice(e.dataset.p,1)[0];bad=[];draw()});
app.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{const s=slots[e.dataset.s];if(s){pool.push(s);slots[e.dataset.s]=null;bad=[];draw()}});
$('#rs').onclick=()=>{pool=sh(seq);slots=[null,null,null,null,null];bad=[];draw()};
$('#ck').onclick=()=>{if(slots.includes(null)){$('#fb').innerHTML='<span class="bad">Fill all the boxes!</span>';return}bad=slots.map((s,i)=>s===seq[i]?-1:i).filter(x=>x>=0);
if(!bad.length){const s=tries==0?3:tries<3?2:1;P.pts+=10;P.stars+=s;finish('order',s);boom();$('#fb').innerHTML=`<div class="card"><div class="star">${'⭐'.repeat(s)}</div><div class="big">You did it!</div><button class="btn go" onclick="go('order')">➡️ New routine</button></div>`}
else{tries++;draw();$('#fb').innerHTML='<span class="bad">Try again!</span> 💡 Think: morning ➡️ class ➡️ home.'}}};draw()}
function vMemory(){const ws=sh(W).slice(0,6),cs=sh(ws.flatMap(w=>[{w,t:'w'},{w,t:'e'}]));let fl=[],ok=new Set(),mv=0,lock=false;
const draw=()=>{app.innerHTML=head('🧠 Memory Game')+`<p style="color:var(--mute)">Moves: ${mv} · Find the word and its picture!</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${cs.map((c,i)=>{const o=ok.has(c.w)||fl.includes(i);return`<button class="fc ${ok.has(c.w)?'ok':''}" data-i="${i}" aria-label="Card ${i+1}" style="min-height:110px;${o?'':'background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:2em'}">${o?(c.t=='e'?`<span class="em">${c.w[1]}</span>`:c.w[0]):'?'}</button>`}).join('')}</div><div class="fbox" id="fb"></div>`;
app.querySelectorAll('.fc').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;if(lock||fl.includes(i)||ok.has(cs[i].w))return;speak(cs[i].w[0]);fl.push(i);if(fl.length==2){mv++;const[a,b]=fl;if(cs[a].w===cs[b].w&&cs[a].t!==cs[b].t){ok.add(cs[a].w);fl=[];P.pts+=10;save();hud();draw();if(ok.size==6){const s=mv<=10?3:mv<=16?2:1;P.stars+=s;finish('memory',s);boom();$('#fb').innerHTML=`<div class="card"><div class="star">${'⭐'.repeat(s)}</div><div class="big">You did it!</div><button class="btn go" onclick="go('memory')">🔄 Play again</button></div>`}return}lock=true;draw();setTimeout(()=>{fl=[];lock=false;draw()},1000);return}draw()})};draw()}
function vFinal(){const w=sh(W).slice(0,10),f=sh(F);quiz('final','🏆 Final Challenge',sh([...w.slice(0,3).map(qL),...w.slice(3,6).map(qR),...w.slice(6,8).map(qT),...f.slice(0,2).map(qF)]))}
home();
</script>
</body>
</html>
